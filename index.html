<!doctype html>
<html lang="bg" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аптеки във Варна</title>
<style>
  :root { --bg:#f5f8f6; --card:#fff; --text:#1c2b24; --muted:#5f6f67; --accent:#0a8f5b; --line:#dde6e1; --warn:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#111915; --card:#1a251f; --text:#e6efe9; --muted:#9db0a5; --accent:#3ccf91; --line:#2a3a31; --warn:#ff7b6b; }
  }
  :root[data-theme="dark"] { --bg:#111915; --card:#1a251f; --text:#e6efe9; --muted:#9db0a5; --accent:#3ccf91; --line:#2a3a31; --warn:#ff7b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header, main, footer { max-width:960px; margin:0 auto; padding:16px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  h1 { margin:8px 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:8px 12px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .controls { display:flex; gap:10px 16px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  input[type=search] { flex:1 1 220px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font:inherit; }
  label { display:flex; gap:6px; align-items:center; }
  #status { color:var(--muted); margin:0 0 12px; min-height:1.5em; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card h2 { font-size:1.1rem; margin:0 0 6px; }
  .badge { display:inline-block; font-size:.72rem; color:#fff; background:var(--accent); border-radius:99px; padding:1px 8px; margin:0 4px 4px 0; vertical-align:middle; }
  .badge.closed { background:var(--warn); }
  .badge.alt { background:var(--muted); }
  .row { margin:4px 0; color:var(--muted); }
  .row b { color:var(--text); font-weight:600; }
  .links { display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; }
  a { color:var(--accent); }
  .note { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Аптеки във Варна</h1>
    <button id="theme" type="button" aria-label="Смяна на режима"></button>
  </div>
  <p class="sub">Работно време, телефон, Google Maps и уебсайт.</p>
</header>
<main>
  <div class="controls">
    <input type="search" id="q" placeholder="Търси по име или адрес…" aria-label="Търсене">
    <button id="locate" class="primary" type="button">📍 Най-близка до мен</button>
  </div>
  <div class="controls">
    <label><input type="checkbox" id="fOpen"> Работят сега</label>
    <label><input type="checkbox" id="f24"> Денонощни</label>
    <label><input type="checkbox" id="fCompound"> Приготвят лекарства</label>
    <label><input type="checkbox" id="fHoliday"> Работят на празници</label>
  </div>
  <p id="status" role="status"></p>
  <div class="grid" id="list"></div>
  <p class="note">Работното време може да се е променило – обади се преди посещение. „—“ означава непотвърдени данни; такива аптеки не попадат във филтрите „Работят сега“, „Приготвят лекарства“ и „Работят на празници“.</p>
</main>
<script>
// Дни: 0 = неделя … 6 = събота. sched: [дни, "откр", "закр"]
const ALL = [0,1,2,3,4,5,6];
const pharmacies = [
  { name:"Аптека Окръжна (Валя Дечева)", address:"бул. Цар Освободител 77А", phone:"052 612 008", h24:true, holiday:true, website:"https://aptekavarna.com/" },
  { name:"Аптека Живита", address:"бул. Владислав Варненчик 65", phone:"052 607 033", h24:true, holiday:true },
  { name:"Санита 98", address:"бул. Владислав Варненчик 12", phone:"052 825 205 / 0888 604 119", h24:true, holiday:true },
  { name:"Санита", address:"бул. Генерал Колев 72", h24:true, holiday:true },
  { name:"Фармедия", address:"кв. Чайка, бл. 204", h24:true, holiday:true },
  { name:"Аптека Попова", address:"ул. 27-ми Юли 16", phone:"052 616 050",
    sched:[[[1,2,3,4,5],"09:00","20:00"],[[6],"10:00","19:00"],[[0],"10:00","18:00"]] },
  { name:"Subra – МОЛ Варна", address:"бул. Владислав Варненчик 186", phone:"052 576 716", sched:[[ALL,"10:00","22:00"]] },
  { name:"Subra – Grand Mall Varna", address:"ул. Андрей Сахаров 2", phone:"0885 280 933", sched:[[ALL,"10:00","22:00"]],
    website:"https://www.grandmall-varna.com/bg/99/apteka/subra" },
  { name:"Subra – Delta Planet Mall", address:"бул. Сливница 185", phone:"0878 588 624" }
];
// compound: true = приготвя лекарства; holiday: true = работи на празници. Липсва = непотвърдено.

const DAYS = ["Нд","Пн","Вт","Ср","Чт","Пт","Сб"];
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
function sofiaNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone:"Europe/Sofia", weekday:"short", hour:"2-digit", minute:"2-digit", hour12:false })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return { day:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday), min:(+p.hour % 24)*60 + +p.minute };
}
function isOpen(p, now) {
  if (p.h24) return true;
  if (!p.sched) return null;
  return p.sched.some(([days,o,c]) => days.includes(now.day) && now.min >= toMin(o) && now.min < toMin(c));
}
function hoursText(p) {
  if (p.h24) return "Денонощно";
  if (!p.sched) return "—";
  return p.sched.map(([days,o,c]) => (days.length === 7 ? "Всеки ден" : days.length === 1 ? DAYS[days[0]] : DAYS[days[0]] + "–" + DAYS[days[days.length-1]]) + " " + o + "–" + c).join(", ");
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- тема ----
const root = document.documentElement, themeBtn = document.getElementById("theme");
function effectiveTheme() { const t = root.dataset.theme; return t === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t; }
function paintThemeBtn() { themeBtn.textContent = effectiveTheme() === "dark" ? "☀️ Дневен" : "🌙 Нощен"; }
try { const s = localStorage.getItem("theme"); if (s) root.dataset.theme = s; } catch (e) {}
themeBtn.onclick = () => {
  root.dataset.theme = effectiveTheme() === "dark" ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  paintThemeBtn();
};
paintThemeBtn();

// ---- местоположение: адресите се геокодират в браузъра (Nominatim) и се кешират ----
let user = null;
const coords = {};
try { Object.assign(coords, JSON.parse(localStorage.getItem("coords") || "{}")); } catch (e) {}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function geocode(p) {
  const key = p.address;
  if (key in coords) return coords[key];
  const street = p.address.replace(/^(бул\.|ул\.|кв\.)\s*/, "");
  let hit = null;
  try {
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=bg&q=" + encodeURIComponent(street + ", Варна, България"));
    const j = await r.json();
    if (j[0]) hit = [+j[0].lat, +j[0].lon];
  } catch (e) { return undefined; }
  coords[key] = hit;
  try { localStorage.setItem("coords", JSON.stringify(coords)); } catch (e) {}
  await sleep(1100);
  return hit;
}
function km(a, b) {
  const R = 6371, rad = x => x*Math.PI/180, dLat = rad(b[0]-a[0]), dLon = rad(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const statusEl = document.getElementById("status");
document.getElementById("locate").onclick = () => {
  if (!navigator.geolocation) { statusEl.textContent = "Браузърът не поддържа определяне на местоположение."; return; }
  statusEl.textContent = "Чакам разрешение за местоположение…";
  navigator.geolocation.getCurrentPosition(async pos => {
    user = [pos.coords.latitude, pos.coords.longitude];
    for (const p of pharmacies) {
      statusEl.textContent = "Определям разстоянията… (" + p.name + ")";
      const c = await geocode(p);
      if (c) p.dist = km(user, c);
      render();
    }
    statusEl.textContent = pharmacies.some(p => p.dist != null) ? "Подредено по разстояние до теб (по права линия)." : "Не успях да определя адресите на картата.";
    render();
  }, err => { statusEl.textContent = err.code === 1 ? "Няма разрешение за местоположение." : "Местоположението не може да бъде определено."; });
};

// ---- списък ----
const $ = id => document.getElementById(id);
function render() {
  const q = $("q").value.trim().toLowerCase(), now = sofiaNow();
  let items = pharmacies.filter(p =>
    (p.name + " " + p.address).toLowerCase().includes(q) &&
    (!$("f24").checked || p.h24) &&
    (!$("fOpen").checked || isOpen(p, now) === true) &&
    (!$("fCompound").checked || p.compound) &&
    (!$("fHoliday").checked || p.holiday));
  if (user) items = items.slice().sort((a, b) => (a.dist ?? Infinity) - (b.dist ?? Infinity));
  $("list").innerHTML = items.length ? items.map(p => {
    const open = isOpen(p, now);
    const map = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.name + ", " + p.address + ", Варна");
    return `<article class="card">
      <h2>${esc(p.name)}</h2>
      <div>${open === true ? '<span class="badge">Отворено</span>' : open === false ? '<span class="badge closed">Затворено</span>' : ""}
        ${p.h24 ? '<span class="badge alt">24ч</span>' : ""}${p.compound ? '<span class="badge alt">Приготвя лекарства</span>' : ""}${p.holiday ? '<span class="badge alt">Работи на празници</span>' : ""}</div>
      <div class="row"><b>Адрес:</b> ${esc(p.address)}, Варна${p.dist != null ? ` · ${p.dist.toFixed(1)} км` : ""}</div>
      <div class="row"><b>Работно време:</b> ${esc(hoursText(p))}</div>
      <div class="row"><b>Телефон:</b> ${p.phone ? `<a href="tel:${esc(p.phone.split("/")[0].replace(/\s/g, ""))}">${esc(p.phone)}</a>` : "—"}</div>
      <div class="links"><a href="${map}" target="_blank" rel="noopener">Google Maps</a>
        ${p.website ? `<a href="${esc(p.website)}" target="_blank" rel="noopener">Уебсайт</a>` : '<span class="row">Уебсайт: —</span>'}</div>
    </article>`;
  }).join("") : "<p>Няма резултати.</p>";
}
["q","fOpen","f24","fCompound","fHoliday"].forEach(id => $(id).addEventListener("input", render));
render();
setInterval(render, 60000);
</script>
</body>
</html>
