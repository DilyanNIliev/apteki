<!doctype html>
<html lang="bg" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аптеки във Варна</title>
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="layout">
<aside class="ad">Място за реклама</aside>
<div class="content">
<nav class="nav"><a class="on" href="./">Аптеки</a><a href="pochivni-dni.html">Почивни дни</a></nav>
<header>
  <div class="top">
    <h1>Аптеки във Варна</h1>
    <button id="theme" type="button" aria-label="Смяна на режима"></button>
  </div>
  <p class="sub">Телефон, адрес, работно време и карта за всяка аптека.</p>
</header>
<main>
  <div class="controls">
    <input type="search" id="q" placeholder="Търси по име, адрес или телефон…" aria-label="Търсене">
    <button id="locate" class="primary" type="button">📍 Най-близка до мен</button>
  </div>
  <div class="controls">
    <label><input type="checkbox" id="fOpen"> Работят сега</label>
    <label><input type="checkbox" id="f24"> Денонощни</label>
    <label><input type="checkbox" id="fCompound"> Приготвят лекарства</label>
    <label><input type="checkbox" id="fHoliday"> Работят на празници</label>
  </div>
  <p id="status" role="status"></p>
  <div class="grid full" id="list"></div>
  <p class="note">Часът на затваряне е по данни от Google Maps към деня на проверката. „Работят сега“ показва само аптеки с известни час на отваряне и затваряне. Обади се преди посещение.</p>
</main>
</div>
<aside class="ad">Място за реклама</aside>
</div>
<script src="common.js"></script>
<script>
let pharmacies = [], user = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const statusEl = $("status");

function hoursText(p) {
  if (p.closedTemp) return "Временно затворена";
  if (p.h24) return "Денонощно";
  if (p.open && p.close) return "Всеки ден " + p.open + "–" + p.close;
  return p.close ? "Затваря в " + p.close + " ч." : "—";
}

// ---- местоположение: адресите се геокодират в браузъра (Nominatim) и се кешират ----
const coords = {};
try { Object.assign(coords, JSON.parse(localStorage.getItem("coords") || "{}")); } catch (e) {}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function geocode(p) {
  if (p.lat != null) return [p.lat, p.lon];
  if (p.address in coords) return coords[p.address];
  const street = p.address.replace(/^(бул\.|ул\.|ж\.к\.|кв\.)\s*/, "").replace(/,.*$/, "");
  let hit = null;
  try {
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=bg&q=" + encodeURIComponent(street + ", Варна, България"));
    const j = await r.json();
    if (j[0]) hit = [+j[0].lat, +j[0].lon];
  } catch (e) { return undefined; }
  coords[p.address] = hit;
  try { localStorage.setItem("coords", JSON.stringify(coords)); } catch (e) {}
  await sleep(1100);
  return hit;
}
function km(a, b) {
  const R = 6371, rad = x => x*Math.PI/180, dLat = rad(b[0]-a[0]), dLon = rad(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
$("locate").onclick = () => {
  if (!navigator.geolocation) { statusEl.textContent = "Браузърът не поддържа определяне на местоположение."; return; }
  statusEl.textContent = "Чакам разрешение за местоположение…";
  navigator.geolocation.getCurrentPosition(async pos => {
    user = [pos.coords.latitude, pos.coords.longitude];
    let done = 0;
    // първо вече известните адреси (кеш), после останалите – едно по едно, за да не претоварваме услугата
    const order = pharmacies.slice().sort((a, b) => ((b.address in coords || b.lat != null) - (a.address in coords || a.lat != null)));
    for (const p of order) {
      const c = await geocode(p);
      if (c) p.dist = km(user, c);
      if (++done % 5 === 0 || done === order.length) { statusEl.textContent = "Определям разстоянията… " + done + "/" + order.length; render(); }
    }
    statusEl.textContent = "Подредено по разстояние до теб (по права линия). Аптеки без разпознат адрес са най-отзад.";
    render();
  }, err => { statusEl.textContent = err.code === 1 ? "Няма разрешение за местоположение." : "Местоположението не може да бъде определено."; });
};

// ---- списък ----
function render() {
  const q = $("q").value.trim().toLowerCase(), now = sofiaNow();
  let items = pharmacies.filter(p =>
    (p.name + " " + p.address + " " + p.phone).toLowerCase().includes(q) &&
    (!$("f24").checked || p.h24) &&
    (!$("fOpen").checked || isOpen(p, now) === true) &&
    (!$("fCompound").checked || p.compound) &&
    (!$("fHoliday").checked || p.holiday));
  if (user) items = items.slice().sort((a, b) => (a.dist ?? Infinity) - (b.dist ?? Infinity));
  $("list").innerHTML = items.length ? items.map(p => {
    const open = isOpen(p, now);
    const page = "apteka/" + p.slug + ".html";
    return `<article class="card">
      <div class="head"><h2><a href="${esc(page)}">${esc(p.name)}</a></h2><div class="links"><a href="${esc(page)}">Подробности и карта →</a></div></div>
      <div>${open === true ? '<span class="badge">Отворено</span>' : open === false ? '<span class="badge closed">Затворено</span>' : ""}
        ${p.h24 ? '<span class="badge alt">24ч</span>' : ""}${p.compound ? '<span class="badge alt">Приготвя лекарства</span>' : ""}${p.holiday ? '<span class="badge alt">Работи на празници</span>' : ""}</div>
      <div class="facts"><div class="row"><b>Адрес:</b> ${esc(p.address)}${p.dist != null ? ` · ${p.dist.toFixed(1)} км` : ""}</div>
      <div class="row"><b>Работно време:</b> ${esc(hoursText(p))}</div>
      <div class="row"><b>Телефон:</b> ${p.phone ? `<a href="tel:${esc(p.phone.replace(/[^\d+]/g, ""))}">${esc(p.phone)}</a>` : "—"}</div>
      </div>
    </article>`;
  }).join("") : "<p>Няма резултати.</p>";
  if (!user) statusEl.textContent = items.length + " от " + pharmacies.length + " аптеки.";
}
["q","fOpen","f24","fCompound","fHoliday"].forEach(id => $(id).addEventListener("input", render));
fetch("data.json").then(r => r.json()).then(d => { pharmacies = d; render(); setInterval(render, 60000); })
  .catch(() => { statusEl.textContent = "Списъкът не може да се зареди."; });
</script>
</body>
</html>
