name: Rebuild pharmacy pages
on:
  push:
    branches: [main]
    paths: [data/pharmacies.txt, data/overrides.json, data/kvartali.json, build.mjs, holidays.js, hours.js, i18n.js]
  schedule:
    - cron: "17 3 1 * *"   # веднъж месечно – обновява годините и датите в SEO текстовете
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Rebuild pharmacy pages" && git push)
